# Pages CMS 設定 — https://pagescms.org
# 非エンジニアの編集者がブラウザから記事・固定ページを編集するための定義。
# 保存すると Pages CMS がこのリポジトリに直接コミット → GitHub Actions が自動リビルド。

# media:
#   input: static/uploads      # アップロード画像の保存先（リポジトリ内）
#   output: /uploads           # 公開URL上のパス

content:
  # ── 記事（発表募集 / 開催案内 / 委員構成 など）──────────────
  # 画像同居のリーフバンドル: content/posts/<スラッグ>/index.md
  - name: posts
    label: 記事
    type: collection
    path: content/posts
    filename: '{fields.slug}.md'   # 1記事 = 1ファイル（フラット）
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: slug,  label: スラッグ（URL・半角英数とハイフン）, type: string, required: true }
      - { name: title, label: タイトル, type: string, required: true }
      - { name: date,  label: 日付,     type: date,   required: true }
      - { name: draft, label: 下書き,   type: boolean, default: false }
      - name: categories
        label: カテゴリ
        type: select
        list: true
        options:
          values: [cfp, program, committee]
      # 本文はプログラムの改行や email ショートコードを含むため、崩れない Markdown ソース編集
      - { name: body, label: 本文（Markdown / ショートコード可）, type: code, options: { format: markdown } }

  # ── 固定ページ（1メニュー「固定ページ」にまとめる: type: group）──────
  - name: pages
    label: 固定ページ
    type: group
    items:
      - name: page-about
        label: ALST研究会について
        type: file
        path: content/about/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 装飾見出しが生HTMLのため rich-text では表示不可 → ソース(Markdown/HTML)編集
          - { name: body,  label: 本文（Markdown / HTMLソース）, type: code, options: { format: markdown } }

      - name: page-awards
        label: 表彰
        type: file
        path: content/awards/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 受賞一覧が生HTMLの表のため rich-text では表示不可 → ソース(Markdown/HTML)編集
          - { name: body,  label: 本文（Markdown / HTMLソース・受賞表）, type: code, options: { format: markdown } }

      - name: page-committee
        label: 委員構成
        type: file
        path: content/committee/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          - { name: body,  label: 本文（Markdown / ショートコード可）, type: code, options: { format: markdown } }

      - name: page-contact
        label: お問い合わせ
        type: file
        path: content/contact/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 本文に cta ショートコードを含むため rich-text ではなくソース編集
          - { name: body,  label: 本文（cta ショートコードを含む）, type: code, options: { format: markdown } }

      - name: page-links
        label: 関連サイトへのリンク
        type: file
        path: content/links/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          - { name: body,  label: 本文（Markdown / ショートコード可）, type: code, options: { format: markdown } }
