# Pages CMS 設定 — https://pagescms.org
# 非エンジニアの編集者がブラウザから記事・固定ページを編集するための定義。
# 保存すると Pages CMS がこのリポジトリに直接コミット → GitHub Actions が自動リビルド。

# media:
#   input: static/uploads      # アップロード画像の保存先（リポジトリ内）
#   output: /uploads           # 公開URL上のパス

content:
  # ══ 発表募集（cfp） content/posts/cfp/ ═══════════════════════════════
  # 開催概要スロット＋cfp専用スロットのみ。program の欄は出ません。
  - name: cfp
    label: 発表募集
    type: collection
    path: content/posts/cfp
    filename: '{fields.slug}.md'
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: slug,  label: スラッグ（URL・半角英数とハイフン）, type: string, required: true }
      - { name: title, label: タイトル, type: string, required: true }
      - { name: date,  label: 日付,     type: date,   required: true }
      - { name: draft, label: 下書き,   type: boolean, default: false }
      - { name: categories, label: カテゴリ, type: select, list: true, default: [cfp], options: { values: [cfp, program, committee] } }
      # ── 開催概要（空欄なら従来の本文表示にフォールバック） ──
      - { name: theme,   label: テーマ（例:一般。空欄なら従来の本文表示）, type: string }
      - { name: alst_no, label: 開催回（数字のみ 例:107）, type: number }
      - { name: date_start, label: 開催日, type: date, default: "" }
      - { name: date_end,   label: 開催日・最終日（合宿など複数日のみ）, type: date, default: "" }
      - { name: venue,           label: 会場, type: string }
      - { name: venue_address,   label: 住所, type: string }
      - { name: venue_access_url, label: アクセスURL, type: string }
      - { name: venue_host,      label: 会場世話人, type: string }
      - name: format
        label: 開催形式
        type: select
        options:
          values: [対面, オンライン, ハイブリッド]
      - { name: format_note, label: 開催形式の補足（例:一般セッションはオンライン参加可）, type: string }
      - { name: fee, label: 参加費（例:無料）, type: string }
      - { name: fee_items, label: 参加費の内訳・合宿など（宿泊費・参加費を1行ずつ）, type: string, list: true }
      - { name: contact_name,  label: お問い合わせ担当（例:古池 謙人（神奈川大学））, type: string }
      - { name: contact_email, label: お問い合わせメール, type: string, default: contact@sig-alst.jp }
      # ── cfp 専用 ──
      - { name: general_online, label: 一般セッションはオンライン可, type: boolean, default: true }
      - { name: wipp_online,    label: WIPPはオンライン可,          type: boolean, default: false }
      - name: deadlines
        label: 締切（発表申込・原稿提出など）
        type: object
        list: true
        fields:
          - { name: label, label: 名称（例:発表申込締切）, type: string }
          - { name: date,  label: 日付, type: date, default: "" }
          - { name: original_date, label: 延長前の日付（延長した場合のみ）, type: date, default: "" }
          - { name: note,  label: 補足（例:※延長しました）, type: string }
      - { name: body, label: 本文（自由記述メモ・旧形式）, type: code, options: { format: markdown } }

  # ══ 開催案内（program） content/posts/program/ ═══════════════════════
  # 開催概要スロット＋program専用スロットのみ。cfp の欄は出ません。
  - name: program
    label: 開催案内
    type: collection
    path: content/posts/program
    filename: '{fields.slug}.md'
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: slug,  label: スラッグ（URL・半角英数とハイフン）, type: string, required: true }
      - { name: title, label: タイトル, type: string, required: true }
      - { name: date,  label: 日付,     type: date,   required: true }
      - { name: draft, label: 下書き,   type: boolean, default: false }
      - { name: categories, label: カテゴリ, type: select, list: true, default: [program], options: { values: [cfp, program, committee] } }
      # ── 開催概要（空欄なら従来の本文表示にフォールバック） ──
      - { name: theme,   label: テーマ（例:一般。空欄なら従来の本文表示）, type: string }
      - { name: alst_no, label: 開催回（数字のみ 例:107）, type: number }
      - { name: date_start, label: 開催日, type: date, default: "" }
      - { name: date_end,   label: 開催日・最終日（合宿など複数日のみ）, type: date, default: "" }
      - { name: venue,           label: 会場, type: string }
      - { name: venue_address,   label: 住所, type: string }
      - { name: venue_access_url, label: アクセスURL, type: string }
      - { name: venue_host,      label: 会場世話人, type: string }
      - name: format
        label: 開催形式
        type: select
        options:
          values: [対面, オンライン, ハイブリッド]
      - { name: format_note, label: 開催形式の補足（例:一般セッションはオンライン参加可）, type: string }
      - { name: fee, label: 参加費（例:無料）, type: string }
      - { name: fee_items, label: 参加費の内訳・合宿など（宿泊費・参加費を1行ずつ）, type: string, list: true }
      - { name: contact_name,  label: お問い合わせ担当（例:古池 謙人（神奈川大学））, type: string }
      - { name: contact_email, label: お問い合わせメール, type: string, default: contact@sig-alst.jp }
      # ── program 専用 ──
      - { name: registration_url,      label: 参加登録フォームURL, type: string }
      - { name: registration_deadline, label: 参加登録締切,        type: date, default: "" }
      - { name: jstage_date,      label: 資料集 J-STAGE公開日,        type: date, default: "" }
      - { name: student_form_url, label: 資料集 学生電子版フォームURL, type: string }
      - { name: student_deadline, label: 資料集 学生電子版締切,       type: date, default: "" }
      - { name: stores_date,      label: 資料集 STORES販売開始日,      type: date, default: "" }
      - name: program
        label: プログラム（タイムテーブル）
        type: object
        list: true
        description: 開催順に上から並べます。種別で「一般セッション/WIPPセッション」を選ぶと発表を追加でき、番号は自動採番。複数日は「日付」ブロックで区切ります。
        fields:
          - name: type
            label: 種別
            type: select
            description: 一般/WIPPセッション=発表あり。日付=複数日の区切り。その他=表示名を入力。
            options:
              values: [一般セッション, WIPPセッション, 日付, 開会挨拶, 閉会の挨拶, 休憩, 昼休み, 専門委員会, その他]
          - { name: time,  label: 時刻（例:11:00-12:00）, type: string }
          - { name: label, label: 表示名（種別=その他/日付で任意に指定するとき）, type: string }
          - { name: date,  label: 日付（種別=日付のとき）, type: date, default: "" }
          - { name: note,  label: セッション補足（例:発表20分，質疑10分）, type: string }
          - { name: intro_time,  label: WIPP ショートイントロ 時間帯（例:17:20-17:35）, type: string }
          - { name: intro_note,  label: WIPP ショートイントロ 補足（例:各3分）, type: string }
          - { name: poster_time, label: WIPP ポスター 時間帯（例:17:35-18:30）, type: string }
          - { name: poster_note, label: WIPP ポスター 補足（例:55分）, type: string }
          - name: talks
            label: 発表
            type: object
            list: true
            fields:
              - { name: title,   label: 題目, type: string }
              - { name: authors, label: 著者, type: string }
      - { name: body, label: 本文（自由記述メモ・送迎バス追記など・旧形式）, type: code, options: { format: markdown } }

  # ══ 委員構成（committee） content/posts/committee/ ═══════════════════
  - name: committee
    label: 委員構成
    type: collection
    path: content/posts/committee
    filename: '{fields.slug}.md'
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: slug,  label: スラッグ（URL・半角英数とハイフン）, type: string, required: true }
      - { name: title, label: タイトル, type: string, required: true }
      - { name: date,  label: 日付,     type: date,   required: true }
      - { name: draft, label: 下書き,   type: boolean, default: false }
      - { name: categories, label: カテゴリ, type: select, list: true, default: [committee], options: { values: [cfp, program, committee] } }
      - { name: body, label: 本文（委員一覧。Markdown / HTMLソース）, type: code, options: { format: markdown } }

  # ── 固定ページ（1メニュー「固定ページ」にまとめる: type: group）──────
  - name: pages
    label: 固定ページ
    type: group
    items:
      - name: page-about
        label: ALST研究会について
        type: file
        path: content/about/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 装飾見出しが生HTMLのため rich-text では表示不可 → ソース(Markdown/HTML)編集
          - { name: body,  label: 本文（Markdown / HTMLソース）, type: code, options: { format: markdown } }

      - name: page-awards
        label: 表彰
        type: file
        path: content/awards/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 受賞一覧が生HTMLの表のため rich-text では表示不可 → ソース(Markdown/HTML)編集
          - { name: body,  label: 本文（Markdown / HTMLソース・受賞表）, type: code, options: { format: markdown } }

      - name: page-committee
        label: 委員構成
        type: file
        path: content/committee/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          - { name: body,  label: 本文（Markdown / ショートコード可）, type: code, options: { format: markdown } }

      - name: page-contact
        label: お問い合わせ
        type: file
        path: content/contact/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          # 本文に cta ショートコードを含むため rich-text ではなくソース編集
          - { name: body,  label: 本文（cta ショートコードを含む）, type: code, options: { format: markdown } }

      - name: page-links
        label: 関連サイトへのリンク
        type: file
        path: content/links/index.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: タイトル, type: string }
          - { name: date,  label: 日付,     type: date }
          - { name: body,  label: 本文（Markdown / ショートコード可）, type: code, options: { format: markdown } }
