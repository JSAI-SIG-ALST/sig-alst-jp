{{- /* context: a Paginator object */ -}}
{{ $p := . }}
{{ if gt $p.TotalPages 1 }}
<nav id="nav-below" class="navigation" role="navigation">
  <h3 class="assistive-text">投稿ナビゲーション</h3>
  <div class="nav-previous">{{ if $p.HasNext }}<a href="{{ $p.Next.URL }}"><span class="meta-nav">←</span> 過去の投稿</a>{{ end }}</div>
  <div class="nav-next">{{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}">新しい投稿 <span class="meta-nav">→</span></a>{{ end }}</div>
</nav><!-- #nav-below -->
{{ end }}
