{{ define "content" }}
<article class="post hentry">
  <header class="entry-header">
    <h1 class="entry-title">{{ .Title }}</h1>
  </header>
  <div class="entry-content">
    {{ .Content }}
  </div>
  {{ if eq .Section "posts" }}
  <footer class="entry-meta">
    <span class="entry-date">{{ .Date.Format "2006年1月2日" }}</span>
    {{ with .Params.categories }} <span class="cat-links">{{ range . }}<a href="{{ ("/categories/" | relURL) }}{{ . | urlize }}/" rel="category tag">{{ index hugo.Data.categories . | default . }}</a> {{ end }}</span>{{ end }}
  </footer>
  {{ end }}
</article>
{{ end }}
